  <text class="m" x="44" y="66" font-size="13" fill="#BFC0C2" text-anchor="end">2</text>
  <text class="m" x="44" y="92" font-size="13" fill="#BFC0C2" text-anchor="end">3</text>
  <text class="m" x="78" y="40" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7">/**  orchestration layer</tspan></text>
  <text class="m" x="78" y="66" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> *   plan → dispatch → verify → synthesize</tspan></text>
  <text class="m" x="78" y="92" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> */</tspan></text>
