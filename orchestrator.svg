<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Orchestration layer — a request reaches a planner that decomposes it, four specialized agents run in parallel, synthesis merges and verifies before the response">
  <defs><style>
    .m { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    
      .wire { fill:none; stroke:#D9D9DB; stroke-width:1.4; }
      .flow { fill:none; stroke:#4078F2; stroke-width:1.6; stroke-dasharray:4 12;
              animation: march 2.8s linear infinite; }
      .d1{animation-delay:0s} .d2{animation-delay:.35s}
      .d3{animation-delay:.7s} .d4{animation-delay:1.05s} .d5{animation-delay:1.4s}
      @keyframes march { to { stroke-dashoffset:-64; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }

  </style></defs>
