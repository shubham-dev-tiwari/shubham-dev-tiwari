<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 412" width="1200" height="412" role="img" aria-label="I build web applications and put AI inside them. Two layers: an orchestration layer that decomposes and verifies requests, and a Supabase data layer. Product surface is React and Next.js. One and a half years in.">
  <defs><style>.m { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }</style></defs>
  <rect width="1200" height="412" fill="#FAFAFA"/>
  <rect x="0" y="0" width="58" height="412" fill="#F1F1F2"/>
  <path d="M58 0V412" stroke="#D9D9DB"/>
  <text class="m" x="44" y="40" font-size="13" fill="#BFC0C2" text-anchor="end">13</text>
  <text class="m" x="78" y="40" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7">/**</tspan></text>
  <text class="m" x="44" y="66" font-size="13" fill="#BFC0C2" text-anchor="end">14</text>
  <text class="m" x="78" y="66" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * I build web applications, and I put AI inside them — the part that</tspan></text>
  <text class="m" x="44" y="92" font-size="13" fill="#BFC0C2" text-anchor="end">15</text>
  <text class="m" x="78" y="92" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * survives contact with real users, not the demo.</tspan></text>
  <text class="m" x="44" y="118" font-size="13" fill="#BFC0C2" text-anchor="end">16</text>
  <text class="m" x="78" y="118" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> *</tspan></text>
  <text class="m" x="44" y="144" font-size="13" fill="#BFC0C2" text-anchor="end">17</text>
  <text class="m" x="78" y="144" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * Two layers, day to day. The </tspan><tspan fill="#7C7E86">orchestration layer</tspan><tspan fill="#A0A1A7">, where a request</tspan></text>
  <text class="m" x="44" y="170" font-size="13" fill="#BFC0C2" text-anchor="end">18</text>
  <text class="m" x="78" y="170" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * gets decomposed, routed across agents and tools, and verified before</tspan></text>
  <text class="m" x="44" y="196" font-size="13" fill="#BFC0C2" text-anchor="end">19</text>
  <text class="m" x="78" y="196" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * anything reaches a user. And the </tspan><tspan fill="#7C7E86">data layer</tspan><tspan fill="#A0A1A7"> underneath it, where</tspan></text>
  <text class="m" x="44" y="222" font-size="13" fill="#BFC0C2" text-anchor="end">20</text>
  <text class="m" x="78" y="222" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * Supabase handles auth, Postgres, and content. The product surface on</tspan></text>
  <text class="m" x="44" y="248" font-size="13" fill="#BFC0C2" text-anchor="end">21</text>
  <text class="m" x="78" y="248" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * top is React and Next.js.</tspan></text>
  <text class="m" x="44" y="274" font-size="13" fill="#BFC0C2" text-anchor="end">22</text>
  <text class="m" x="78" y="274" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> *</tspan></text>
  <text class="m" x="44" y="300" font-size="13" fill="#BFC0C2" text-anchor="end">23</text>
  <text class="m" x="78" y="300" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * One and a half years in. Long enough to have shipped things, short</tspan></text>
  <text class="m" x="44" y="326" font-size="13" fill="#BFC0C2" text-anchor="end">24</text>
  <text class="m" x="78" y="326" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> * enough to still be annoyed by my own old code.</tspan></text>
  <text class="m" x="44" y="352" font-size="13" fill="#BFC0C2" text-anchor="end">25</text>
  <text class="m" x="78" y="352" font-size="15" xml:space="preserve"><tspan fill="#A0A1A7"> */</tspan></text>
</svg>